name: generate streak data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: generate daily streak data
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=default&locale=zh_Hans&timezone=Asia/Shanghai
          path: dist/daily-streak.svg
      - name: generate weekly streak data
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=default&locale=zh_Hans&mode=weekly&timezone=Asia/Shanghai
          path: dist/weekly-streak.svg
      - name: Deploy to streak branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: streak_data
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

